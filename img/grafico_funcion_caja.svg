<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Diagrama de función: entrada x, caja f, salida y</title> 
  <desc id="desc">Un esquema en blanco y negro con una caja rotulada f, una entrada x arriba y una salida y a la derecha.</desc>

  <style>
    .linea {
      fill: none;
      stroke: #000;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .texto {
      font-family: "Times New Roman", Times, serif;
      fill: #000;
      font-size: 29px;
    }
    .italica {
      font-style: italic;
    }
  </style>

  <!-- Texto superior -->
  <text class="texto" x="76" y="32">Entrada <tspan class="italica">x</tspan></text>

  <!-- Embudo de entrada -->
  <path class="linea" d="M204 56 C221 60, 245 60, 263 56" />
  <path class="linea" d="M204 56 L226 100" />
  <path class="linea" d="M263 56 L240 100" />
   <path class="linea" d="M226 100 C231 103, 235 103, 240 100" />
  <ellipse class="linea" cx="233.5" cy="56" rx="30" ry="4.5" />

  <!-- Caja principal -->
  <path class="linea" d="M143 104 L262 104 L262 177 L143 177 Z" />
  <path class="linea" d="M143 104 L166 93 L285 93 L262 104" />
  <path class="linea" d="M262 104 L285 93 L285 164 L262 177" />

  <!-- Letra f dentro de la caja -->
  <text class="texto italica" x="180" y="157" font-size="34">f</text>

  

  <!-- Bocina / salida -->
  <ellipse class="linea" cx="333" cy="148" rx="5" ry="45" /> 
  <path class="linea" d="M274 140 L333 102" />
  <path class="linea" d="M274 156 L333 193" />
   <path class="linea" d="M274 140 C272 145, 272 151, 274 156" />

  <!-- Texto de salida -->
  <text class="texto" x="344" y="148">Salida <tspan class="italica">y</tspan></text>
</svg>
